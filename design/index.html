<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>SkyFi — кит</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@700;800&display=swap" rel="stylesheet" />
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: #000;
    color: #fff;
    font-family: Inter, system-ui, sans-serif;
    min-height: 100vh;
    padding: 48px 24px 64px;
  }
  .wrap { max-width: 560px; margin: 0 auto; }
  .logo {
    font-family: "Plus Jakarta Sans", Inter, sans-serif;
    font-weight: 800;
    font-size: 28px;
    letter-spacing: -0.02em;
  }
  .logo span { color: #1ed760; }
  .sub { color: #a7a7a7; font-size: 14px; margin: 10px 0 28px; line-height: 1.55; }
  a.card {
    display: block;
    text-decoration: none;
    color: inherit;
    background: #121212;
    border: 1px solid #1ed760;
    border-radius: 18px;
    padding: 22px 20px 20px;
  }
  .num { font-size: 12px; color: #a7a7a7; letter-spacing: .12em; text-transform: uppercase; }
  h2 { font-family: "Plus Jakarta Sans", Inter, sans-serif; font-size: 19px; font-weight: 800; margin: 10px 0 6px; }
  p { font-size: 13px; color: #a7a7a7; line-height: 1.5; }
  .dots { display: flex; gap: 6px; margin-top: 16px; }
  .dots i { width: 18px; height: 18px; border-radius: 50%; border: 1px solid rgba(255,255,255,.14); }
</style>
</head>
<body>
<div class="wrap">
  <div class="logo">Свод <span>/ кит</span></div>
  <p class="sub">Один выбранный кит. Макеты экранов — отдельные статичные страницы из этих же атомов, не приложение.</p>
  <a class="card" href="./variant-02-mint-green.html">
    <div class="num">Кит</div>
    <h2>Мятный грин</h2>
    <p>Токены, состояния, плеер, списки, друзья, шары, детали, phone / tv / car.</p>
    <div class="dots">
      <i style="background:#000000"></i><i style="background:#121212"></i><i style="background:#1ed760"></i><i style="background:#ffffff"></i><i style="background:#a7a7a7"></i>
    </div>
  </a>
</div>
</body>
</html>
