<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <title>SkyFi</title>

    <base href="/" />

    <meta name="color-scheme" content="dark" />
    <meta
      name="viewport"
      content="viewport-fit=cover, width=device-width, initial-scale=1.0, minimum-scale=1.0, maximum-scale=1.0, user-scalable=no"
    />
    <meta name="format-detection" content="telephone=no" />
    <meta name="msapplication-tap-highlight" content="no" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@700;800&display=swap"
      rel="stylesheet"
    />

    <link rel="shortcut icon" type="image/png" href="/favicon.png" />

    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="SkyFi" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black" />

    <style>
      /* Сплэш до загрузки JS: тот же вид, что у AppSplash.vue */
      body {
        background: #000000;
      }
      .boot-splash {
        position: fixed;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #000000;
      }
      .boot-splash-lockup {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 16px;
      }
      .boot-splash-mark {
        width: 72px;
        height: 72px;
        color: #3ee87f;
        animation: boot-splash-pulse 2.4s ease-in-out infinite;
      }
      .boot-splash-word {
        font-family: 'Plus Jakarta Sans', sans-serif;
        font-size: 28px;
        font-weight: 700;
        letter-spacing: 0.4px;
        color: #ffffff;
      }
      .boot-splash-word b {
        font-weight: 800;
      }
      @keyframes boot-splash-pulse {
        0%,
        100% {
          opacity: 1;
        }
        50% {
          opacity: 0.55;
        }
      }
    </style>
  </head>

  <body>
    <div id="app">
      <div class="boot-splash" aria-hidden="true">
        <div class="boot-splash-lockup">
          <svg class="boot-splash-mark" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
            <path d="M4.2 10.6a8.4 8.4 0 0 1 15.6 0" stroke-linecap="butt" />
            <path d="M9 12.4v8.1l7.7-4.05z" fill="currentColor" stroke="none" />
          </svg>
          <div class="boot-splash-word">Sky<b>Fi</b></div>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
